[package]
name = "libp2p-wasi-sockets-p2p-dialer"
version = "0.1.0"
edition = "2021"
publish = false

# Only ever built for wasm32-wasip2.
# Dials the address in DIAL_ADDR, asserts ConnectionEstablished from any peer.
# One half of the M12 WASM-to-WASM direct-connection test.

[[bin]]
name = "p2p-dialer"
path = "src/main.rs"

[dependencies]
libp2p-wasi-sockets = { path = "../../.." }
libp2p-core         = { version = "0.43", default-features = false }
libp2p-noise        = "0.46"
libp2p-yamux        = "0.47"
libp2p-swarm        = { version = "0.47", features = ["macros"] }
libp2p-identity     = { version = "0.2", default-features = false, features = ["ed25519", "rand"] }
wstd                = "0.6"
futures             = { version = "0.3", default-features = false, features = ["std", "async-await"] }
