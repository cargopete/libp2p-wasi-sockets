[package]
name = "libp2p-wasi-sockets-rendezvous"
version = "0.1.0"
edition = "2021"
publish = false

# Only ever built for wasm32-wasip2.
# A single binary that runs as either registrant or discoverer depending on MODE:
#   MODE=register  — listens on LISTEN_PORT, dials SERVER_ADDR, registers under
#                    namespace "wasm-peers", exits on Registered event.
#   MODE=discover  — dials SERVER_ADDR, discovers "wasm-peers", asserts ≥1
#                    registration returned, exits.

[[bin]]
name = "rendezvous"
path = "src/main.rs"

[dependencies]
libp2p-wasi-sockets  = { path = "../../.." }
libp2p-core          = { version = "0.43", default-features = false }
libp2p-noise         = "0.46"
libp2p-yamux         = "0.47"
libp2p-swarm         = { version = "0.47", features = ["macros"] }
libp2p-rendezvous    = "0.17"
libp2p-identity      = { version = "0.2", default-features = false, features = ["ed25519", "rand"] }
wstd                 = "0.6"
futures              = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[patch.crates-io]
futures-timer = { path = "../../../crates/futures-timer-wasi" }
