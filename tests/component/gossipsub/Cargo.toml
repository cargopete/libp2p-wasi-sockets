[package]
name = "libp2p-wasi-sockets-gossipsub"
version = "0.1.0"
edition = "2021"
publish = false

# Only ever built for wasm32-wasip2.
# A single binary that runs as either a gossipsub listener or publisher
# depending on the MODE environment variable:
#   MODE=listen   — binds on LISTEN_PORT, subscribes to /test/1.0.0, waits
#                   for b"hello M13" from the publisher.
#   MODE=publish  — dials DIAL_ADDR, subscribes to /test/1.0.0, waits for
#                   the listener to subscribe, then publishes b"hello M13".

[[bin]]
name = "gossipsub"
path = "src/main.rs"

[dependencies]
libp2p-wasi-sockets = { path = "../../.." }
libp2p-core         = { version = "0.43", default-features = false }
libp2p-noise        = "0.46"
libp2p-yamux        = "0.47"
libp2p-swarm        = { version = "0.47", features = ["macros"] }
libp2p-gossipsub    = "0.49"
libp2p-identity     = { version = "0.2", default-features = false, features = ["ed25519", "rand"] }
wstd                = "0.6"
futures             = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[patch.crates-io]
futures-timer = { path = "../../../crates/futures-timer-wasi" }
