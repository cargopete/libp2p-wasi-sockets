[package]
name = "libp2p-wasi-sockets"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
description = "WASI 0.2 sockets transport for rust-libp2p"
repository = "https://github.com/cargopete/libp2p-wasi-sockets"
keywords = ["libp2p", "wasi", "wasm", "p2p", "transport"]
categories = ["network-programming", "wasm"]

[dependencies]
libp2p-core     = { version = "0.43", default-features = false }
libp2p-identity = { version = "0.2",  default-features = false, features = ["peerid"] }
wstd            = "0.6"
futures         = { version = "0.3", default-features = false, features = ["std", "async-await"] }
multiaddr       = "0.18"
thiserror       = "1"
tracing         = { version = "0.1", default-features = false }

[dev-dependencies]
libp2p-swarm    = { version = "0.47", features = ["macros"] }
libp2p-noise    = "0.46"
libp2p-yamux    = "0.47"
libp2p-ping     = "0.47"
libp2p-identify = "0.47"
wasmtime        = "44"
wasmtime-wasi   = "44"
tokio           = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
anyhow          = "1"

[lib]
crate-type = ["rlib"]
